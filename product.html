<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — Famacrafts</title>

  <!-- Favicon / app icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />

  <!-- Speed up product-image loads from Supabase storage -->
  <link rel="preconnect" href="https://gggiojhvkpatmakkgkuq.supabase.co" crossorigin />

  <meta name="description" content="A handmade piece from Famacrafts — crafted with love in Lahore. Order on WhatsApp." />
  <!-- canonical / og are refined per-product by JS once the product loads -->
  <meta property="og:type" content="product" />
  <meta property="og:site_name" content="Famacrafts" />
  <meta property="og:locale" content="en_PK" />
  <meta property="og:image" content="https://famacrafts.pk/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Dancing+Script:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Shared styles (tokens, nav, buttons, product card, carousel, lightbox, footer) -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Product-page-specific UI -->
  <style>
    .product-page { padding: 28px 0 80px; }
    @media (min-width: 720px) { .product-page { padding: 44px 0 110px; } }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--label);
      font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
      color: var(--plum);
      margin-bottom: 22px;
    }
    @media (hover: hover) { .back-link:hover { color: var(--pink-deep); } }

    /* single product reads a touch larger than a catalog card */
    .product-page .product { max-width: 980px; margin: 0 auto; }
    .product-page .product-name { font-size: clamp(28px, 5vw, 44px); }
    .product-page .product-desc { display: block; }

    .product-state {
      max-width: 560px; margin: 60px auto; text-align: center;
    }
    .product-state h1 {
      font-family: var(--serif); font-style: italic; font-weight: 400;
      font-size: clamp(30px, 6vw, 48px); color: var(--ink); margin-bottom: 12px;
    }
    .product-state p { color: var(--ink-soft); margin-bottom: 22px; }
  </style>
</head>
<body>

  <!-- ── Sticky nav ─────────────────────────────────────────── -->
  <header class="nav" role="banner">
    <div class="container">
      <a href="index.html" class="nav-brand">Famacrafts</a>
      <button class="nav-menu-btn" id="menuOpenBtn" aria-label="Open navigation menu">Menu</button>
    </div>
  </header>

  <!-- ── Full-screen overlay nav ───────────────────────────── -->
  <div class="nav-overlay" id="navOverlay" role="dialog" aria-modal="true" aria-label="Navigation menu">
    <button class="nav-overlay-close" id="menuCloseBtn" aria-label="Close navigation menu">✕</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="catalog.html">Catalog</a></li>
      <li><a href="index.html#workshops">Workshops</a></li>
      <li><a href="index.html#custom">Custom Orders</a></li>
    </ul>
  </div>

  <main id="top">
    <section class="product-page">
      <div class="container">
        <a href="catalog.html" class="back-link">← All products</a>
        <div id="product-view">
          <p class="empty-state">Loading…</p>
        </div>
      </div>
    </section>
  </main>

  <!-- ── Footer ─────────────────────────────────────────────── -->
  <footer>
    <div class="container">
      <span class="footer-brand">Famacrafts</span>
      <span class="footer-label">Made by hand · Made with love</span>
      <nav class="footer-links" aria-label="Footer links">
        <a id="footer-ig"  href="#" target="_blank" rel="noopener">Instagram</a>
        <a id="footer-wa"  href="#" target="_blank" rel="noopener">WhatsApp</a>
        <a id="footer-loc" href="#">Lahore, Pakistan</a>
      </nav>
      <p class="footer-copy">© <span id="copy-year"></span> Famacrafts. All rights reserved.</p>
      <p class="footer-credit">Developed by <a href="https://velocis.io" target="_blank" rel="noopener">Velocis</a></p>
    </div>
  </footer>

  <!-- ── Lightbox ───────────────────────────────────────────── -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Product photo">
    <button type="button" class="lightbox-nav prev" aria-label="Previous photo">‹</button>
    <img class="lightbox-img" id="lightbox-img" alt="" />
    <button type="button" class="lightbox-nav next" aria-label="Next photo">›</button>
    <button type="button" class="lightbox-close" aria-label="Close">✕</button>
  </div>

  <!-- ── WhatsApp FAB ───────────────────────────────────────── -->
  <a class="fab" id="fabBtn" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="white" aria-hidden="true">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
      <path d="M12 0C5.373 0 0 5.373 0 12c0 2.118.553 4.103 1.518 5.83L0 24l6.335-1.492A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.017-1.374l-.36-.214-3.727.977.998-3.645-.234-.374A9.818 9.818 0 0112 2.182c5.425 0 9.818 4.393 9.818 9.818 0 5.426-4.393 9.818-9.818 9.818z"/>
    </svg>
  </a>

  <!-- ── Data + Supabase ───────────────────────────────────── -->
  <script src="config.js"></script>
  <script src="products.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- ── App script ─────────────────────────────────────────── -->
  <script>
    (function () {
      'use strict';

      var D = window.FAMACRAFTS || {};
      var SITE = 'https://famacrafts.pk';

      // ── Helpers ──────────────────────────────────────────
      function getParam(name) {
        try { return new URLSearchParams(location.search).get(name) || ''; }
        catch (e) { return ''; }
      }
      function productLink(pid) { return SITE + '/product.html?id=' + encodeURIComponent(pid); }
      function waUrl(productName, link) {
        var tmpl = D.whatsappTemplate || "Hi Famacrafts! I'm interested in {PRODUCT}.";
        var msg = tmpl.replace('{PRODUCT}', productName);
        if (link) { msg += '\n\nProduct link: ' + link; }
        return 'https://wa.me/' + (D.whatsapp || '') + '?text=' + encodeURIComponent(msg);
      }
      function esc(str) {
        return String(str || '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function imgSrc(raw, w) {
        if (!raw) return '';
        if (raw.includes('res.cloudinary.com') && raw.includes('/upload/')) {
          return raw.replace('/upload/', '/upload/w_' + w + ',q_80,f_auto/');
        }
        // Route Supabase Storage images through our own edge-caching proxy
        // (functions/storage/product-images/) instead of hitting Supabase's
        // metered egress on every visitor's request.
        var supaMarker = '/storage/v1/object/public/product-images/';
        var si = raw.indexOf(supaMarker);
        if (si >= 0) {
          return location.origin + '/storage/product-images/' + raw.slice(si + supaMarker.length);
        }
        return raw;
      }
      function imagesOf(p) {
        var imgs = [];
        if (Array.isArray(p.images)) { imgs = p.images.filter(function (u) { return u && String(u).trim(); }); }
        if (!imgs.length) { var single = p.image_url || p.image || ''; if (single) { imgs = [single]; } }
        return imgs;
      }

      // ── Carousel (deferred slides hydrate on first intent) ──
      function hydrateCarousel(c) {
        if (!c || c.dataset.hydrated) { return; }
        c.dataset.hydrated = '1';
        var pending = c.querySelectorAll('.carousel-slide[data-src]');
        Array.prototype.forEach.call(pending, function (s) {
          s.src = s.getAttribute('data-src');
          s.removeAttribute('data-src');
        });
      }
      function initCarousels(container) {
        var carousels = container.querySelectorAll('.carousel[data-count]');
        Array.prototype.forEach.call(carousels, function (c) {
          if (parseInt(c.getAttribute('data-count'), 10) <= 1) { return; }
          var track = c.querySelector('.carousel-track');
          var dots  = c.querySelectorAll('.carousel-dot');
          if (!track || !dots.length) { return; }
          ['pointerdown', 'touchstart', 'mouseenter'].forEach(function (ev) {
            c.addEventListener(ev, function () { hydrateCarousel(c); }, { passive: true, once: true });
          });
          track.addEventListener('scroll', function () {
            hydrateCarousel(c);
            var idx = Math.round(track.scrollLeft / track.clientWidth);
            Array.prototype.forEach.call(dots, function (d, i) { d.classList.toggle('active', i === idx); });
          }, { passive: true });
        });
      }

      // ── Lightbox ──────────────────────────────────────────
      var lbImages = [], lbIndex = 0;
      function lbShow() {
        var lb = document.getElementById('lightbox');
        document.getElementById('lightbox-img').src = lbImages[lbIndex] || '';
        var multi = lbImages.length > 1;
        lb.querySelector('.lightbox-nav.prev').hidden = !multi;
        lb.querySelector('.lightbox-nav.next').hidden = !multi;
      }
      function openLightbox(images, index) {
        lbImages = images || []; lbIndex = index || 0;
        if (!lbImages.length) { return; }
        lbShow();
        document.getElementById('lightbox').classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        document.getElementById('lightbox').classList.remove('open');
        document.getElementById('lightbox-img').src = '';
        document.body.style.overflow = '';
      }
      function lbStep(d) {
        if (lbImages.length < 2) { return; }
        lbIndex = (lbIndex + d + lbImages.length) % lbImages.length;
        lbShow();
      }
      (function setupLightbox() {
        var lb = document.getElementById('lightbox');
        if (!lb) { return; }
        lb.addEventListener('click', function (e) {
          if (e.target === lb || e.target.closest('.lightbox-close')) { closeLightbox(); return; }
          var nav = e.target.closest('.lightbox-nav');
          if (nav) { lbStep(nav.classList.contains('next') ? 1 : -1); }
        });
        document.addEventListener('keydown', function (e) {
          if (!lb.classList.contains('open')) { return; }
          if (e.key === 'Escape') { closeLightbox(); }
          else if (e.key === 'ArrowRight') { lbStep(1); }
          else if (e.key === 'ArrowLeft') { lbStep(-1); }
        });
      })();

      // ── Render one product ───────────────────────────────
      function renderProduct(p) {
        var view = document.getElementById('product-view');
        var pid = p.id || getParam('id');
        var imgs = imagesOf(p);

        var html = '<article class="product">';
        html += '<div class="product-img-wrap">';
        if (imgs.length) {
          html += '<div class="carousel" data-count="' + imgs.length + '">';
          html += '<div class="carousel-track">';
          imgs.forEach(function (u, idx) {
            var src800 = esc(imgSrc(u, 800));
            html += '<img class="carousel-slide"'
              + (idx === 0 ? ' src="' + src800 + '"' : ' data-src="' + src800 + '"')
              + ' data-full="' + esc(imgSrc(u, 1600)) + '"'
              + ' alt="' + esc(p.name) + (imgs.length > 1 ? ' — photo ' + (idx + 1) + ' of ' + imgs.length : '') + '"'
              + ' decoding="async"'
              + (idx === 0 ? ' loading="eager"' : '')
              + ' onerror="this.classList.add(\'slide-failed\')"'
              + ' />';
          });
          html += '</div>';
          if (imgs.length > 1) {
            html += '<button type="button" class="carousel-nav prev" aria-label="Previous image">‹</button>';
            html += '<button type="button" class="carousel-nav next" aria-label="Next image">›</button>';
            html += '<div class="carousel-dots">';
            imgs.forEach(function (u, idx) {
              html += '<span class="carousel-dot' + (idx === 0 ? ' active' : '') + '" data-idx="' + idx + '"></span>';
            });
            html += '</div>';
          }
          html += '</div>';
        } else {
          html += '<div class="product-img-placeholder">image<br>coming soon</div>';
        }
        html += '</div>';

        html += '<div class="product-body">';
        if (p.category) { html += '<p class="product-category">' + esc(p.category) + '</p>'; }
        html += '<h1 class="product-name">' + esc(p.name) + '</h1>';
        if (p.tagline) { html += '<p class="product-tagline">' + esc(p.tagline) + '</p>'; }
        if (p.description) { html += '<p class="product-desc">' + esc(p.description) + '</p>'; }
        html += '<div class="product-actions">';
        html += '<a class="btn" href="' + esc(waUrl(p.name, productLink(pid))) + '" target="_blank" rel="noopener">';
        html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.118.553 4.103 1.518 5.83L0 24l6.335-1.492A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.017-1.374l-.36-.214-3.727.977.998-3.645-.234-.374A9.818 9.818 0 0112 2.182c5.425 0 9.818 4.393 9.818 9.818 0 5.426-4.393 9.818-9.818 9.818z"/></svg>';
        html += 'Order on WhatsApp</a>';
        html += '<button class="btn ghost share-btn" type="button" data-share-url="' + esc(productLink(pid)) + '" data-share-title="' + esc(p.name) + '">Share</button>';
        html += '</div></div></article>';

        view.innerHTML = html;
        initCarousels(view);
        wireView(view, imgs);
        setSeo(p, imgs);
      }

      function renderNotFound() {
        document.getElementById('product-view').innerHTML =
          '<div class="product-state">'
          + '<h1>Product not found</h1>'
          + '<p>This piece may have sold out or moved. Browse the full collection instead.</p>'
          + '<a class="btn" href="catalog.html">View all products</a>'
          + '</div>';
        document.title = 'Product not found — Famacrafts';
      }

      // Click handling within the product view (carousel, lightbox, share)
      function wireView(view) {
        view.addEventListener('click', function (e) {
          var nav = e.target.closest('.carousel-nav');
          if (nav) {
            var navCar = nav.closest('.carousel'); hydrateCarousel(navCar);
            var track = navCar.querySelector('.carousel-track');
            track.scrollBy({ left: nav.classList.contains('next') ? track.clientWidth : -track.clientWidth, behavior: 'smooth' });
            return;
          }
          var dot = e.target.closest('.carousel-dot');
          if (dot) {
            var dotCar = dot.closest('.carousel'); hydrateCarousel(dotCar);
            var tk = dotCar.querySelector('.carousel-track');
            tk.scrollTo({ left: tk.clientWidth * (parseInt(dot.getAttribute('data-idx'), 10) || 0), behavior: 'smooth' });
            return;
          }
          var slide = e.target.closest('.carousel-slide');
          if (slide) {
            var allSlides = slide.closest('.carousel-track').querySelectorAll('.carousel-slide');
            var urls = Array.prototype.map.call(allSlides, function (s) { return s.getAttribute('data-full') || s.src; });
            var idx = Array.prototype.indexOf.call(allSlides, slide);
            openLightbox(urls, idx < 0 ? 0 : idx);
            return;
          }
          var share = e.target.closest('.share-btn');
          if (share) {
            var sUrl = share.getAttribute('data-share-url');
            var sTitle = share.getAttribute('data-share-title') || 'Famacrafts';
            if (navigator.share) {
              navigator.share({ title: sTitle, url: sUrl }).catch(function () {});
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(sUrl).then(function () {
                var prev = share.textContent;
                share.textContent = 'Link copied ✓';
                setTimeout(function () { share.textContent = prev; }, 1800);
              });
            }
          }
        });
      }

      // ── Per-product SEO (title, meta, og, JSON-LD) ────────
      function setMeta(sel, attr, val) {
        var el = document.head.querySelector(sel);
        if (el && val) { el.setAttribute(attr, val); }
      }
      function setSeo(p, imgs) {
        var pid = p.id || getParam('id');
        var url = productLink(pid);
        var img = imgs && imgs.length ? imgSrc(imgs[0], 1200) : (SITE + '/assets/og-image.png');
        var desc = (p.description || p.tagline || 'Handmade by Famacrafts in Lahore.').slice(0, 200);

        document.title = p.name + ' — Famacrafts';
        setMeta('meta[name="description"]', 'content', desc);

        // canonical
        var canon = document.head.querySelector('link[rel="canonical"]');
        if (!canon) { canon = document.createElement('link'); canon.rel = 'canonical'; document.head.appendChild(canon); }
        canon.href = url;

        // open graph / twitter (helps JS-capable consumers; static fallback in <head>)
        setMeta('meta[property="og:type"]', 'content', 'product');
        upsertMeta('property', 'og:title', p.name + ' — Famacrafts');
        upsertMeta('property', 'og:description', desc);
        upsertMeta('property', 'og:url', url);
        upsertMeta('property', 'og:image', img);
        upsertMeta('name', 'twitter:title', p.name + ' — Famacrafts');
        upsertMeta('name', 'twitter:description', desc);
        upsertMeta('name', 'twitter:image', img);

        // Product JSON-LD
        var data = {
          "@context": "https://schema.org",
          "@type": "Product",
          "name": p.name,
          "url": url,
          "brand": { "@type": "Brand", "name": "Famacrafts" }
        };
        if (p.category) { data.category = p.category; }
        if (desc) { data.description = desc; }
        if (imgs && imgs.length) { data.image = imgs.map(function (u) { return imgSrc(u, 1200); }); }
        var s = document.getElementById('product-jsonld');
        if (!s) { s = document.createElement('script'); s.type = 'application/ld+json'; s.id = 'product-jsonld'; document.head.appendChild(s); }
        s.textContent = JSON.stringify(data);
      }
      function upsertMeta(keyAttr, keyVal, content) {
        if (!content) { return; }
        var sel = 'meta[' + keyAttr + '="' + keyVal + '"]';
        var el = document.head.querySelector(sel);
        if (!el) { el = document.createElement('meta'); el.setAttribute(keyAttr, keyVal); document.head.appendChild(el); }
        el.setAttribute('content', content);
      }

      // ── Wire static parts (footer, FAB, nav) ─────────────
      function wireStatic() {
        document.getElementById('copy-year').textContent = new Date().getFullYear();
        var footerIg = document.getElementById('footer-ig');
        if (D.instagramUrl) { footerIg.href = D.instagramUrl; }
        document.getElementById('footer-wa').href  = 'https://wa.me/' + (D.whatsapp || '');
        document.getElementById('footer-loc').textContent = D.location || 'Lahore, Pakistan';
        document.getElementById('fabBtn').href = 'https://wa.me/' + (D.whatsapp || '');

        var overlay  = document.getElementById('navOverlay');
        var openBtn  = document.getElementById('menuOpenBtn');
        var closeBtn = document.getElementById('menuCloseBtn');
        function openMenu()  { overlay.classList.add('open');    document.body.style.overflow = 'hidden'; closeBtn.focus(); }
        function closeMenu() { overlay.classList.remove('open'); document.body.style.overflow = '';       openBtn.focus();  }
        openBtn.addEventListener('click', openMenu);
        closeBtn.addEventListener('click', closeMenu);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu(); });
      }

      // ── Boot ──────────────────────────────────────────────
      function findLocal(id) {
        var list = (D.products || []);
        for (var i = 0; i < list.length; i++) { if (String(list[i].id) === String(id)) { return list[i]; } }
        return null;
      }
      async function boot() {
        wireStatic();
        var id = getParam('id');
        if (!id) { renderNotFound(); return; }

        var useSupabase = window.SUPABASE_URL && window.SUPABASE_ANON_KEY
          && window.SUPABASE_URL !== '' && window.SUPABASE_ANON_KEY !== '';
        if (useSupabase && window.supabase) {
          try {
            var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
            var res = await sb.from('products').select('*').eq('id', id).maybeSingle();
            if (res.error) { throw res.error; }
            if (res.data) { renderProduct(res.data); } else { renderNotFound(); }
            return;
          } catch (err) {
            console.warn('Supabase fetch failed, trying local data', err);
          }
        }
        var local = findLocal(id);
        if (local) { renderProduct(local); } else { renderNotFound(); }
      }
      boot();
    })();
  </script>

</body>
</html>
